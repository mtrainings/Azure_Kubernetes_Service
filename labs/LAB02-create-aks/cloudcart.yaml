apiVersion: v1
kind: Namespace
metadata:
  name: cloudcart
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart-api
  namespace: cloudcart
  labels:
    app: cloudcart-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcart-api
  template:
    metadata:
      labels:
        app: cloudcart-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # numeric UID of the "node" user - required to verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ${ACR}.azurecr.io/cloudcart:1.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.0"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcart-api
  namespace: cloudcart
spec:
  type: ClusterIP
  selector:
    app: cloudcart-api
  ports:
    - port: 80
      targetPort: 8080
