apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cloudcart-gw
  namespace: cloudcart
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  gatewayClassName: approuting-istio
  infrastructure:
    annotations:
      # copied to the generated LoadBalancer Service -> <label>.<region>.cloudapp.azure.com
      service.beta.kubernetes.io/azure-dns-label-name: ${DNS_LABEL}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: ${APP_HOST}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloudcart-tls
      allowedRoutes:
        namespaces:
          from: Same
