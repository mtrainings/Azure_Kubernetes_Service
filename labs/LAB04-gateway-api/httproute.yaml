apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudcart-routes
  namespace: cloudcart
spec:
  parentRefs:
    - name: cloudcart-gw
      sectionName: http
  rules:
    # /v2/<anything> -> v2, prefix removed
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cloudcart-v2
          port: 80
    # header-based routing for testers
    - matches:
        - headers:
            - name: X-Canary
              value: "true"
      backendRefs:
        - name: cloudcart-v2
          port: 80
    # everything else -> v1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cloudcart-api
          port: 80
