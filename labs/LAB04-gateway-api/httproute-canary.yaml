apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudcart-routes
  namespace: cloudcart
spec:
  parentRefs:
    - name: cloudcart-gw
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: cloudcart-v2
          port: 80
    # weighted split: 90 % v1, 10 % v2
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cloudcart-api
          port: 80
          weight: 90
        - name: cloudcart-v2
          port: 80
          weight: 10
