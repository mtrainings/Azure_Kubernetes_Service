apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploads
  namespace: cloudcart
spec:
  replicas: 3
  selector:
    matchLabels:
      app: uploads
  template:
    metadata:
      labels:
        app: uploads
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # numeric UID of the "node" user - required to verify non-root
        runAsGroup: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: uploads
      containers:
        - name: api
          image: ${ACR}.azurecr.io/cloudcart:1.0
          env:
            - name: DATA_DIR
              value: /data
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: uploads
