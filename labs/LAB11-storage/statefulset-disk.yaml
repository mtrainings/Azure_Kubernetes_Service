apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: cloudcart
spec:
  clusterIP: None
  selector:
    app: orders
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders
  namespace: cloudcart
spec:
  serviceName: orders
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000                    # the 'node' user can write to the disk
      containers:
        - name: api
          image: ${ACR}.azurecr.io/cloudcart:1.0
          env:
            - name: DATA_DIR
              value: /data
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 4Gi
