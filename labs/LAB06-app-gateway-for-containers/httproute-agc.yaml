apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cloudcart-agc
  namespace: cloudcart
spec:
  parentRefs:
    - name: cloudcart-agc
  rules:
    - backendRefs:
        - name: cloudcart-api
          port: 80
          weight: 80
        - name: cloudcart-v2
          port: 80
          weight: 20
