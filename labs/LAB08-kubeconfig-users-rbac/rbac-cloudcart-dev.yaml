# Workloads in the cloudcart namespace - everything except Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudcart-developer
  namespace: cloudcart
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, configmaps, endpoints, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudcart-developers
  namespace: cloudcart
subjects:
  - kind: Group
    name: cloudcart-devs          # O= in the certificate, or an Entra group object ID (LAB09)
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudcart-developer
  apiGroup: rbac.authorization.k8s.io
