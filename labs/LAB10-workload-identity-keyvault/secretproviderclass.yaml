apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloudcart-kv
  namespace: cloudcart
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}          # workload identity: the pod's service account must be federated
    keyvaultName: ${KV}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
