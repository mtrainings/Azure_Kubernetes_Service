# LAB14 (GitHub track) - copy to .github/workflows/deploy.yml in your fork
# Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (federated credential for this repo)
# Variables: ACR_NAME, RESOURCE_GROUP, CLUSTER_NAME
name: Build and deploy CloudCart

on:
  push:
    branches: [main]
    paths: ["app/**", "charts/**"]
  workflow_dispatch:

permissions:
  id-token: write        # OIDC token for azure/login - no client secret
  contents: read

env:
  NAMESPACE: cloudcart-cicd
  TAG: ${{ github.run_number }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment: cloudcart-lab
    steps:
      - uses: actions/checkout@v5

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image (ACR Tasks)
        run: az acr build -r ${{ vars.ACR_NAME }} -t cloudcart:$TAG app/

      - name: Lint the Helm chart
        run: helm lint charts/cloudcart

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: latest

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.CLUSTER_NAME }}
          use-kubelogin: "true"

      - name: Helm upgrade + smoke test
        run: |
          helm upgrade --install cloudcart charts/cloudcart -n $NAMESPACE \
            --set image.repository=${{ vars.ACR_NAME }}.azurecr.io/cloudcart \
            --set image.tag=$TAG --set appVersion=$TAG \
            --wait --timeout 5m
          helm test cloudcart -n $NAMESPACE --logs
